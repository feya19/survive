[project]
name = "survive-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "python-multipart>=0.0.9", "pydantic-settings>=2.5,<3", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.13,<2", "pandas>=2.2,<3", "openpyxl>=3.1,<4", "pandera>=0.21,<1", "celery[redis]>=5.4,<6", "redis>=5,<7", "openai>=1.50,<3", "instructor>=1.7,<2", "papermill>=2.6,<3", "ipykernel>=6.29,<8", "scikit-learn>=1.5,<2", "lightgbm>=4.5,<5", "matplotlib>=3.9,<4", "seaborn>=0.13,<1", "joblib>=1.4,<2", "httpx>=0.27,<1"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=5,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
